name: Nuevo miembro
description: Agrega tu información al directorio de AstroCO
title: "Nuevo miembro: "
labels: ["nuevo-miembro"]
body:
  - type: input
    id: nombre
    attributes:
      label: Nombre completo
    validations:
      required: true
  - type: input
    id: pronombres
    attributes:
      label: Pronombres (opcional)
  - type: input
    id: institucion
    attributes:
      label: Institución
    validations:
      required: true
  - type: input
    id: posicion
    attributes:
      label: Posición
      description: Estudiante, posdoc, profesor, investigador, aficionado, docente, divulgador, etc.
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Áreas de interés
      description: Separadas por punto y coma
  - type: input
    id: ciudad
    attributes:
      label: Ciudad
  - type: input
    id: pais
    attributes:
      label: País
  - type: input
    id: orcid
    attributes:
      label: ORCID iD (opcional)
  - type: input
    id: sitio_web
    attributes:
      label: Sitio web (opcional)
  - type: input
    id: github
    attributes:
      label: Usuario de GitHub (opcional)
  - type: input
    id: correo
    attributes:
      label: Correo público (opcional)
      description: Solo si autorizas publicarlo
  - type: checkboxes
    id: consentimiento
    attributes:
      label: Consentimiento
      options:
        - label: Autorizo publicar esta información en un repositorio público
          required: true
